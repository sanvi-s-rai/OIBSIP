<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional iPhone Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="iphone-container">

        <div class="calculator">

            <!-- Display -->
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <!-- Top Row -->
                <button class="btn light" data-action="clear">C</button>
                <button class="btn light" data-action="backspace">⌫</button>
                <button class="btn light" data-value="%">%</button>
                <button class="btn orange" data-operator="÷">÷</button>

                <!-- Number Row -->
                <button class="btn dark" data-value="7">7</button>
                <button class="btn dark" data-value="8">8</button>
                <button class="btn dark" data-value="9">9</button>
                <button class="btn orange" data-operator="×">×</button>

                <button class="btn dark" data-value="4">4</button>
                <button class="btn dark" data-value="5">5</button>
                <button class="btn dark" data-value="6">6</button>
                <button class="btn orange" data-operator="−">−</button>

                <button class="btn dark" data-value="1">1</button>
                <button class="btn dark" data-value="2">2</button>
                <button class="btn dark" data-value="3">3</button>
                <button class="btn orange" data-operator="+">+</button>

                <!-- Bottom Row -->
                <button class="btn dark wide" data-value="0">0</button>
                <button class="btn dark" data-value=".">.</button>
                <button class="btn orange" data-action="calculate">=</button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
